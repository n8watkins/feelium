name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps --only-shell chromium
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Run unit tests
        run: npm test
      - name: Test atomic data operations
        run: npm run test:data-operations
      - name: Test behavior categories
        run: npm run test:categories
      - name: Test fresh and legacy database migrations
        run: npm run test:migrations
      - name: Build and test authenticated browser flows
        run: npm run test:e2e
      - name: Install Turso CLI and libSQL server
        run: |
          turso_archive="$RUNNER_TEMP/turso-cli.tar.gz"
          sqld_archive="$RUNNER_TEMP/libsql-server.tar.xz"
          curl --proto '=https' --tlsv1.2 -LsSf -o "$turso_archive" https://github.com/tursodatabase/turso-cli/releases/download/v1.0.29/turso-cli_Linux_x86_64.tar.gz
          curl --proto '=https' --tlsv1.2 -LsSf -o "$sqld_archive" https://github.com/tursodatabase/libsql/releases/download/libsql-server-v0.24.32/libsql-server-x86_64-unknown-linux-gnu.tar.xz
          echo "0eae140b030b11ad98540ed85ceb62575100135e51038009064e50675822c0f5  $turso_archive" | sha256sum --check
          echo "71720fc8648c19efef416efebd47145ef59b62e198770533530a858e1336879f  $sqld_archive" | sha256sum --check
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$turso_archive" -C "$HOME/.local/bin" turso
          tar -xJf "$sqld_archive" -C "$HOME/.local/bin" --strip-components=1 libsql-server-x86_64-unknown-linux-gnu/sqld
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Test persistence over the Turso HTTP transport
        run: npm run test:persistence:local
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
