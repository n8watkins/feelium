name: Reminder delivery

# Calls /api/notifications/send on the deployment named by the REMINDER_CRON_URL repository
# variable (the Vercel deployment, which serves production until the move to Cloudflare),
# because Vercel Hobby only allows a once-daily cron. The Cloudflare Worker runs the same
# schedule as its own Cron Trigger (wrangler.jsonc), so delete this workflow once production
# moves there.

on:
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reminder-delivery
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Trigger reminder delivery
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          REMINDER_CRON_URL: ${{ vars.REMINDER_CRON_URL }}
        run: |
          test -n "$CRON_SECRET"
          test -n "$REMINDER_CRON_URL"
          curl --request POST \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 2 \
            --retry-delay 2 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 55 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "${REMINDER_CRON_URL%/}/api/notifications/send"
